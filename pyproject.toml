[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leanline"
version = "0.1.0"
description = "Local MCP server that cuts the tokens an AI assistant spends on documents and logs, with every saving measured."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Hafeez Izaz" }]
dependencies = [
  "mcp>=1.2",
  "python-docx>=1.1",
  "pypdf>=4.0",
  "python-pptx>=0.6.23",
  "tiktoken>=0.7",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
leanline = "leanline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
